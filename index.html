<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Метеорология для яхтсменов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Курс по местным ветрам и прогнозу погоды для капитанов: главы со схемами и тренажёрами на вымышленной бухте">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* A book of plates. Chapters read top to bottom in one column of serif prose; each chapter has one
   large figure (schematic or 3D chart of the bay) with its controls and a live caption directly under
   it. Palette taken from paper nautical charts: white paper, blue shallows, buff land, and the chart's
   magenta for everything the reader can operate. Night theme follows a chart plotter's night mode. */
:root {
  --paper: #fbfcfc; --ink: #1b2a3a; --muted: #5b6a78; --rule: #d6e0e6; --plate: #eaf2f7;
  --sea: #cfe3ee; --land: #ece2c6; --accent: #a3246f; --accent-ink: #ffffff; --accent-soft: rgba(163, 36, 111, 0.1);
  --front: #2559b5; --danger: #c22f3a; --warn: #c7711b; --ok: #2c7f52; --truth: #8e2c9a; --est: #4b5563;
  --grid: rgba(27, 42, 58, 0.2); --band: rgba(42, 91, 132, 0.24); --band2: rgba(42, 91, 132, 0.2);
  --scene-bg: #dbe6ee; --field: #ffffff;
  --f-text: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --measure: 36rem; --wide: 72rem;
  /* names used by older components */
  --bg: var(--paper); --panel: var(--field); --line: var(--rule); --chip: var(--plate);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1620; --ink: #d6dfe7; --muted: #8e9dab; --rule: #22303e; --plate: #131f2b;
    --sea: #15283a; --land: #2b2a23; --accent: #e07ab6; --accent-ink: #14101a; --accent-soft: rgba(224, 122, 182, 0.14);
    --front: #79a6ff; --danger: #ff737d; --warn: #f0a24a; --ok: #5cc48c; --truth: #d68ae0; --est: #c3cbd4;
    --grid: rgba(214, 223, 231, 0.22); --band: rgba(127, 176, 214, 0.32); --band2: rgba(127, 176, 214, 0.24);
    --scene-bg: #0d1823; --field: #16222e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1620; --ink: #d6dfe7; --muted: #8e9dab; --rule: #22303e; --plate: #131f2b;
  --sea: #15283a; --land: #2b2a23; --accent: #e07ab6; --accent-ink: #14101a; --accent-soft: rgba(224, 122, 182, 0.14);
  --front: #79a6ff; --danger: #ff737d; --warn: #f0a24a; --ok: #5cc48c; --truth: #d68ae0; --est: #c3cbd4;
  --grid: rgba(214, 223, 231, 0.22); --band: rgba(127, 176, 214, 0.32); --band2: rgba(127, 176, 214, 0.24);
  --scene-bg: #0d1823; --field: #16222e; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--paper); color: var(--ink); }
body { margin: 0; font: 16px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 0.18em; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------------------------------------------------------------- header */
.top { position: sticky; top: 0; z-index: 6; background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule); padding-top: env(safe-area-inset-top, 0px); }
.top-inner { max-width: var(--wide); margin: 0 auto; display: flex; align-items: center; gap: 16px; min-height: 52px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font: 600 19px/1.1 var(--f-text); color: var(--ink); text-decoration: none; white-space: nowrap; }
.top-nav { display: flex; align-items: center; gap: 18px; margin-left: auto; min-width: 0; }
.toc { position: relative; min-width: 0; }
.toc summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 10px; padding: 8px 0; min-width: 0; }
.toc summary::-webkit-details-marker { display: none; }
.toc-word { font-weight: 600; color: var(--accent); }
.toc-word::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 7px; border-right: 1.5px solid; border-bottom: 1.5px solid; transform: translateY(-3px) rotate(45deg); }
.toc[open] .toc-word::after { transform: translateY(0) rotate(-135deg); }
.toc-label { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 28ch; }
.toc nav { position: absolute; right: 0; top: calc(100% + 6px); width: min(26rem, calc(100vw - 32px)); max-height: 75vh; overflow-y: auto; background: var(--field); border: 1px solid var(--rule); box-shadow: 0 12px 32px rgba(10, 20, 30, 0.16); padding: 8px 0; }
.toc-list { margin: 0; padding: 0 0 0 2.6em; font: 17px/1.3 var(--f-text); }
.toc-list li { padding: 0; }
.toc-list li::marker { color: var(--muted); font: 14px var(--f-ui); }
.toc-list a { display: block; padding: 8px 16px 8px 4px; color: var(--ink); text-decoration: none; }
.toc-list a:hover { color: var(--accent); }
.toc-list a[aria-current="page"] { color: var(--accent); font-weight: 600; }
.ref-link { color: var(--ink); text-decoration: none; white-space: nowrap; }
.ref-link[aria-current="page"], .ref-link:hover { color: var(--accent); }

/* ---------------------------------------------------------------- chapter */
main#main { padding: 0 max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.chapter, .ref { max-width: var(--wide); margin: 0 auto; }
.ch-head, .prose, .key, .services, .pager { max-width: var(--measure); margin-left: auto; margin-right: auto; }
.ch-head { padding: 48px 0 8px; }
.ch-num { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
.ch-title { font: 600 clamp(30px, 4.6vw, 46px)/1.08 var(--f-text); letter-spacing: -0.012em; margin: 0; text-wrap: balance; }
.ch-lead { font: italic 400 21px/1.45 var(--f-text); color: var(--muted); margin: 14px 0 0; text-wrap: pretty; }
.prose { font: 400 19px/1.62 var(--f-text); }
.prose p { margin: 0 0 0.85em; text-wrap: pretty; hyphens: auto; }
.chapter > .prose:first-of-type { margin-top: 22px; }

/* The plate: figure, live caption, controls. Wider than the text column. */
.plate { margin: 28px 0 32px; display: grid; gap: 0; }
.plate-stage { position: relative; min-width: 0; }
.plate-under { min-width: 0; display: grid; gap: 16px; }
.plate-under:empty { display: none; }
.plate-under > * { margin-top: 18px; }

/* Live caption (wind at the yacht or at the point on the schematic). */
.readout { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; padding: 14px 0 12px; border-bottom: 1px solid var(--rule); }
.readout-top { display: contents; }
.readout-barb { width: 52px; height: 52px; grid-row: span 2; align-self: start; margin-top: 12px; }
.readout-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; min-width: 0; }
.ro-title { color: var(--muted); font-size: 14px; flex-basis: 100%; }
.ro-big { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.ro-num { font: 600 32px/1 var(--f-ui); font-variant-numeric: tabular-nums; }
.ro-num::after { content: ""; display: inline-block; width: 11px; height: 11px; margin-left: 7px; background: var(--c); vertical-align: 0.15em; box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 25%, transparent); }
.ro-unit { color: var(--muted); }
.ro-gust { margin-left: 6px; }
.ro-gust b { font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.ro-meta { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.readout-extra { grid-column: 2; display: grid; gap: 2px; font-size: 15px; }
.readout-extra:empty { display: none; }

/* Controls sit directly under the caption, in a row on wide screens. */
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px 28px; padding: 16px 0 4px; align-items: end; }
.ctl { display: grid; gap: 6px; min-width: 0; }
.ctl-row { display: flex; justify-content: space-between; gap: 10px; align-items: last baseline; }
.controls > .btn { justify-self: start; align-self: end; }
.ctl-label { font-size: 14px; color: var(--muted); }
.ctl-value { font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 26px; margin: 0; }
.ctl-toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 15px; min-height: 32px; }
.ctl-toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch { width: 38px; height: 22px; border-radius: 11px; background: color-mix(in srgb, var(--muted) 45%, var(--paper)); position: relative; flex: none; transition: background 0.15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); transition: transform 0.15s; }
.ctl-toggle input:checked + .switch { background: var(--accent); }
.ctl-toggle input:checked + .switch::after { transform: translateX(16px); }
.ctl-toggle input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; width: fit-content; max-width: 100%; }
.seg button { border: 0; border-right: 1px solid var(--rule); background: transparent; padding: 7px 12px; font-size: 15px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--accent-soft); }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--accent); color: var(--accent); background: transparent; padding: 8px 14px; cursor: pointer; border-radius: 3px; font-size: 15px; text-decoration: none; display: inline-block; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.extras { display: grid; gap: 14px; padding-top: 14px; }
.extras:empty { display: none; }

/* Key points: the only list on the page. */
.key { margin-top: 8px; padding-top: 18px; border-top: 1px solid var(--ink); }
.key h2 { font: 600 15px/1.3 var(--f-ui); margin: 0 0 8px; }
.key ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font: 18px/1.45 var(--f-text); }
.key li::marker { color: var(--accent); }

.services { margin-top: 28px; font-size: 15px; }
.video { max-width: var(--measure); margin: 28px auto 0; }
.video-frame { position: relative; aspect-ratio: 16 / 9; background: var(--plate); }
.video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video figcaption { font: 400 14px/1.45 var(--f-ui); color: var(--muted); margin-top: 8px; }
.video figcaption a { font-weight: 600; }
.video-link { border-top: 1px solid var(--rule); padding-top: 14px; }
.video-link figcaption { font-size: 15px; color: var(--ink); margin: 0; }
.services h3 { font: 600 15px/1.3 var(--f-ui); margin: 0 0 8px; }
.services .svc-list { margin: 0 0 10px; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
.services .svc-list dt, .services .svc-list dd { margin: 0; }
@media (max-width: 560px) { .services .svc-list { grid-template-columns: 1fr; gap: 2px; } .services .svc-list dd { margin-bottom: 8px; } }
.services a { font-weight: 600; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--rule); }
.pager a { display: grid; gap: 2px; text-decoration: none; color: var(--ink); padding: 6px 0; }
.pager a span { font-size: 14px; color: var(--muted); }
.pager a b { font: 600 19px/1.25 var(--f-text); }
.pager a:hover b { color: var(--accent); }
.pg-next { text-align: right; }

/* ---------------------------------------------------------------- figures */
.section { margin: 0; display: grid; gap: 8px; min-width: 0; }
.section-title { order: 2; font-size: 14px; color: var(--muted); }
.section-canvas { width: 100%; display: block; background: #f4f7fb; }
.section-big .section-canvas { cursor: crosshair; }
.plate-under .section { margin-top: 22px; }

.map-wrap { position: relative; overflow: hidden; width: 100%; background: var(--scene-bg); }
.map-wrap.no-gl { padding: 40px 16px; text-align: center; color: var(--muted); }
.map-canvas { display: block; width: 100%; outline: none; cursor: grab; }
.map-canvas:active { cursor: grabbing; }
.map-wrap:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.map-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 20px; padding-top: 8px; }
.map-hint { margin: 0; font-size: 14px; color: var(--muted); }
.scale { display: flex; align-items: stretch; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex: 0 1 380px; min-width: 240px; }
.scale span { flex: 1; padding-top: 4px; border-top: 6px solid var(--c); }
.scale .scale-title { flex: 0 0 auto; border: 0; padding: 4px 8px 0 0; }

.map-labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 12px/1.2 var(--f-ui); color: #1c2a44; text-shadow: 0 0 3px rgba(255,255,255,0.9), 0 0 6px rgba(255,255,255,0.7); will-change: transform; }
.lbl-water, .lbl-name { font: italic 600 14px/1.2 var(--f-text); color: #0f3e66; text-shadow: 0 0 4px rgba(255,255,255,0.85); }
.lbl-small { font-size: 12px; }
.lbl-land, .lbl-peak { color: #3b3425; }
.lbl-place { background: #1b2a3a; color: #fff; text-shadow: none; padding: 2px 6px; border-radius: 2px; }
.lbl-note { color: #4b5563; font-style: italic; }
.lbl-cold, .lbl-front { color: #1d5fa8; font-weight: 700; }
.lbl-danger { color: #b3202b; font-weight: 700; }
.lbl-press { font: 700 34px/1 var(--f-text); text-align: center; }
.lbl-press small { display: block; font: 600 12px/1.2 var(--f-ui); }
.lbl-high { color: #1d5fa8; } .lbl-low { color: #b3202b; }
.lbl.lbl-press small, .lbl.lbl-danger, .lbl.lbl-cold, .lbl.lbl-front { background: rgba(255,255,255,0.86); padding: 1px 5px; border-radius: 2px; text-shadow: none; }
.lbl.lbl-yacht { background: var(--accent); color: #fff; text-shadow: none; padding: 3px 8px; border-radius: 2px; font: 600 13px/1.2 var(--f-ui); font-variant-numeric: tabular-nums; z-index: 2; }
.lbl-yacht b { font-size: 15px; }
.lbl-place, .lbl-yacht { text-shadow: none !important; color: #fff !important; }
.yacht-mark { position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #1b2a3a, inset 0 0 0 2px #1b2a3a; pointer-events: none; }
.place-mark { position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%; background: #1b2a3a; border: 3px solid #fff; box-shadow: 0 0 0 2px #1b2a3a, 0 2px 6px rgba(0,0,0,0.35); pointer-events: auto; }
.place-mark.harbour { background: var(--accent); border-radius: 3px; }
.view-btns { position: absolute; bottom: 8px; right: 8px; display: flex; border-radius: 3px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
.view-btns button { border: 0; background: rgba(251,252,252,0.92); color: #1b2a3a; padding: 6px 11px; font-size: 13px; cursor: pointer; }
.view-btns button + button { border-left: 1px solid #d6e0e6; }
.view-btns button.on { background: #1b2a3a; color: #fff; }
.compass { position: absolute; top: 10px; left: 10px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.88); box-shadow: 0 1px 4px rgba(0,0,0,0.2); pointer-events: none; }
.compass svg { width: 100%; height: 100%; display: block; }
.map-toast { position: absolute; left: 8px; right: 8px; top: 8px; padding: 8px 12px; background: rgba(27,42,58,0.92); color: #fff; font-size: 14px; border-radius: 3px; pointer-events: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .lbl { color: #e6edf3; text-shadow: 0 0 3px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.6); }
  :root:not([data-theme="light"]) .lbl-water, :root:not([data-theme="light"]) .lbl-name { color: #9cc8ec; }
  :root:not([data-theme="light"]) .lbl-land, :root:not([data-theme="light"]) .lbl-peak { color: #d8d0bd; }
  :root:not([data-theme="light"]) .lbl.lbl-high { color: #7fb0ff; } :root:not([data-theme="light"]) .lbl.lbl-low, :root:not([data-theme="light"]) .lbl.lbl-danger { color: #ff7a84; }
  :root:not([data-theme="light"]) .lbl.lbl-cold, :root:not([data-theme="light"]) .lbl.lbl-front { color: #8ab8ff; }
  :root:not([data-theme="light"]) .lbl.lbl-press small, :root:not([data-theme="light"]) .lbl.lbl-danger, :root:not([data-theme="light"]) .lbl.lbl-cold, :root:not([data-theme="light"]) .lbl.lbl-front { background: rgba(10,20,32,0.84); }
}
:root[data-theme="dark"] .lbl { color: #e6edf3; text-shadow: 0 0 3px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.6); }
:root[data-theme="dark"] .lbl-water, :root[data-theme="dark"] .lbl-name { color: #9cc8ec; }
:root[data-theme="dark"] .lbl-land, :root[data-theme="dark"] .lbl-peak { color: #d8d0bd; }
:root[data-theme="dark"] .lbl.lbl-high { color: #7fb0ff; } :root[data-theme="dark"] .lbl.lbl-low, :root[data-theme="dark"] .lbl.lbl-danger { color: #ff7a84; }
:root[data-theme="dark"] .lbl.lbl-cold, :root[data-theme="dark"] .lbl.lbl-front { color: #8ab8ff; }
:root[data-theme="dark"] .lbl.lbl-press small, :root[data-theme="dark"] .lbl.lbl-danger, :root[data-theme="dark"] .lbl.lbl-cold, :root[data-theme="dark"] .lbl.lbl-front { background: rgba(10,20,32,0.84); }

/* ---------------------------------------------------------------- charts, tables, legends */
.chart-box { display: grid; gap: 6px; }
.chart-title { font-size: 14px; color: var(--muted); }
.chart { width: 100%; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); align-items: center; }
.legend-note { flex-basis: 100%; color: var(--ink); font-size: 15px; }
.lg::before { content: ""; display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
.lg-band::before { height: 8px; border: 0; background: var(--band2); }
.lg-p50::before { border-color: var(--ink); }
.lg-mean::before { border-color: var(--ink); border-top-style: dashed; }
.lg-mem::before { border-color: color-mix(in srgb, var(--ink) 35%, transparent); border-top-width: 1px; }
.chart-links { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.chart-links a { font-weight: 600; }
.lg-p90::before { border-color: var(--warn); }
.lg-truth::before { border-color: var(--accent); border-top-width: 3px; }
.lg-truthg::before { border-color: var(--accent); border-top-width: 2px; border-top-style: dotted; }
.lg-dot::before { border-color: var(--ink); border-top-style: dotted; }
.lg-limit::before { border-color: var(--danger); border-top-style: dashed; }
.lg-t8::before { border-color: var(--truth); border-top-width: 3px; }
.lg-est::before { border-color: var(--est); border-top-style: dotted; border-top-width: 2px; }
.lg-ev::before { width: 8px; height: 8px; border: 0; border-radius: 50%; background: var(--danger); }
.stage { display: grid; gap: 4px; font-size: 15px; }
.stage-head { font-weight: 600; }
.tbl-wrap { overflow-x: auto; }
.tbl { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.tbl th { font-size: 13px; color: var(--muted); font-weight: 600; }
.tbl.bf td:nth-child(1), .tbl.bf td:nth-child(3), .tbl.bf td:nth-child(4) { white-space: nowrap; }
.row-fact td { font-weight: 700; }
.note { margin: 0; font-size: 14px; color: var(--muted); }
.lead { margin: 0; font: 18px/1.55 var(--f-text); }
.theory { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: 15px; }

/* ---------------------------------------------------------------- final passage */
.final > .prose { margin-top: 22px; }
.final-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 28px; align-items: start; margin-top: 28px; }
.final-map { position: sticky; top: 64px; min-width: 0; display: grid; gap: 8px; }
.final-panel { min-width: 0; display: grid; gap: 16px; }
.final-body { display: grid; gap: 14px; }
.stepper { display: flex; flex-wrap: wrap; gap: 4px 16px; list-style: none; margin: 0; padding: 0 0 10px; font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--rule); }
.stepper li { display: flex; align-items: center; gap: 6px; }
.stepper li span { font-variant-numeric: tabular-nums; }
.stepper li span::after { content: "."; }
.stepper li.on { color: var(--accent); font-weight: 600; }
.stepper li.done { color: var(--ink); }
.cards { display: grid; gap: 10px; }
.card { text-align: left; border: 1px solid var(--rule); background: var(--field); padding: 14px 16px; cursor: pointer; display: grid; gap: 4px; border-radius: 3px; }
.card:hover { border-color: var(--accent); }
.card-title { font: 600 20px/1.2 var(--f-text); }
.card-sub { font-size: 14px; color: var(--muted); }
.card-text { font-size: 15px; color: var(--muted); }
.brief-grid { display: grid; gap: 10px; }
.sketch { width: 100%; display: block; border: 1px solid var(--rule); }
.bulletin { margin: 0; padding: 14px 16px; background: var(--plate); font: 15px/1.55 var(--f-text); white-space: pre-wrap; overflow-x: auto; }
.quiz { border: 0; border-top: 1px solid var(--rule); padding: 14px 0 0; margin: 0; display: grid; gap: 6px; }
.quiz-q { font-weight: 600; }
.quiz-opt { text-align: left; border: 1px solid var(--rule); background: var(--field); padding: 9px 12px; cursor: pointer; border-radius: 3px; font-size: 15px; }
.quiz-opt:hover:not(:disabled) { border-color: var(--accent); }
.quiz-opt:disabled { cursor: default; opacity: 0.75; }
.quiz-opt.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--field)); opacity: 1; }
.quiz-opt.bad { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--field)); opacity: 1; }
.quiz-fb { font-size: 15px; }
.quiz-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.chk-q { display: flex; flex-wrap: wrap; gap: 6px; }
.chk-q > .quiz-q, .chk-q > .ests { flex-basis: 100%; }
.chk-list { display: grid; gap: 12px; }
.chk-item { display: grid; gap: 2px; font-size: 15px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
.chk-title { font-weight: 600; }
.chk-k { color: var(--muted); }
.chk-ok .chk-you { color: var(--ok); } .chk-bad .chk-you { color: var(--danger); }
.ests { display: grid; gap: 8px; }
.est { display: flex; align-items: center; gap: 8px; font-size: 15px; flex-wrap: wrap; }
.est span:first-child { flex: 1 1 180px; }
.est input { width: 84px; padding: 6px 8px; border: 1px solid var(--rule); background: var(--field); border-radius: 3px; font-variant-numeric: tabular-nums; }
.plan { display: grid; gap: 8px; }
.clock { font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; padding: 8px 12px; background: var(--ink); color: var(--paper); }
.log-box summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; max-height: 180px; overflow-y: auto; font-variant-numeric: tabular-nums; }
.log .ev { padding-left: 8px; border-left: 3px solid var(--warn); }
.log .ev-squall, .log .ev-gust { border-left-color: var(--danger); }
.verdict { font: 600 24px/1.2 var(--f-text); padding: 4px 0; }
.v-ok { color: var(--ok); } .v-warn { color: var(--warn); } .v-bad { color: var(--danger); }
.alert { padding: 10px 12px; border-left: 4px solid var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--field)); font-weight: 600; }

/* ---------------------------------------------------------------- reference */
.ref { display: grid; gap: 22px; }
.ref .ch-head { max-width: none; margin: 0; }
.ref-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.ref-grid > div { display: grid; gap: 10px; min-width: 0; }
.ref h3 { font: 600 20px/1.25 var(--f-text); margin: 8px 0 0; }
.barb-key { width: 100%; max-width: 380px; height: auto; aspect-ratio: 380 / 75; }
.glossary { margin: 0; display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr); gap: 8px 16px; font-size: 15px; }
.glossary dt { font-weight: 600; } .glossary dd { margin: 0; }
.ref-gloss { margin-top: 36px; display: grid; gap: 10px; }
@media (min-width: 900px) { .ref-gloss .glossary { grid-template-columns: minmax(0, 12em) minmax(0, 1fr) minmax(0, 12em) minmax(0, 1fr); gap: 10px 20px; } }

footer.foot { max-width: var(--measure); margin: 0 auto; padding: 0 16px 32px; font-size: 13px; color: var(--muted); }

/* ---------------------------------------------------------------- narrow screens */
@media (max-width: 900px) {
  .final-grid, .ref-grid { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .final-map { position: static; }
}
@media (max-width: 620px) {
  .ch-head { padding-top: 28px; }
  .ch-lead { font-size: 19px; }
  .prose { font-size: 18px; line-height: 1.58; }
  .plate { margin: 20px -16px 26px; }
  .plate-stage .map-foot, .readout, .controls, .extras, .plate-under > * { padding-left: 16px; padding-right: 16px; }
  .section-title { padding: 0 16px; }
  .controls { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .ro-num { font-size: 28px; }
  .readout-barb { width: 44px; height: 44px; }
  .toc-label { display: none; }

  .toc nav { position: fixed; left: 12px; right: 12px; width: auto; top: calc(env(safe-area-inset-top, 0px) + 58px); max-height: calc(100vh - 80px); }
  .brand { font-size: 17px; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pg-next { text-align: left; }
  .glossary { grid-template-columns: minmax(0, 1fr); }
  .glossary dd { margin-bottom: 6px; }
  .lbl-press { font-size: 26px; }
}
@media (pointer: coarse) {
  .seg button, .btn, .quiz-opt, .card, .view-btns button { min-height: 44px; }
  .view-btns button { min-width: 44px; font-size: 14px; }
  input[type="range"] { height: 36px; }
  .toc summary, .ref-link { min-height: 44px; display: flex; align-items: center; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------------------------------------------------------------- final passage: navigation, forecast tools, situations */
.stepper li .step-btn { display: inline-flex; gap: 6px; align-items: center; border: 0; background: none; padding: 4px 0; color: inherit; font: inherit; }
.stepper li button.step-btn { cursor: pointer; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 0.25em; }
.stepper li button.step-btn:hover { color: var(--accent); }
.final-nav { position: sticky; bottom: 0; z-index: 2; display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; margin-top: 8px; background: var(--paper); border-top: 1px solid var(--rule); }
.fc-box { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 4px 0; }

.fc-tools { display: grid; gap: 12px; padding: 6px 0 10px; min-width: 0; }
.place-btns .btn { padding: 5px 10px; font-size: 14px; }
.fc-scroll { overflow-x: auto; border: 1px solid var(--rule); }
.fc-table { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fc-table th { position: sticky; left: 0; background: var(--field); text-align: left; font-weight: 600; padding: 4px 8px; border-right: 1px solid var(--rule); color: var(--muted); }
.fc-table td { text-align: center; padding: 4px 3px; min-width: 34px; border-bottom: 1px solid var(--rule); }
.fc-table td small { display: block; font-size: 10.5px; color: var(--muted); }
.fc-arrow { display: inline-block; font-weight: 700; }
.fc-now { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.fc-ts { color: var(--danger); font-weight: 700; }
.sit { display: grid; gap: 8px; padding: 14px; border: 2px solid var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--field)); }
.sit-time { font-weight: 600; font-variant-numeric: tabular-nums; }
.sit-text { margin: 0; font: 18px/1.45 var(--f-text); }
.sit-q { font-weight: 600; }
.score { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: 15px; }
.score dt { font-weight: 600; } .score dd { margin: 0; }
.fc-tools > *, .final-panel > *, .final-body > * { min-width: 0; }
.fc-table th { z-index: 1; }
.stepper li .step-btn::after { content: none; }
.video + .key { margin-top: 28px; }

.final-intro summary { cursor: pointer; font: 500 15px/1.4 var(--f-ui); color: var(--accent); margin-bottom: 8px; }
.final-intro[open] summary { display: none; }
.chk-many { font-weight: 400; color: var(--muted); }
@media (min-width: 700px) { .controls .ctl-wide { grid-column: span 2; } }

/* Title page */
.cover { max-width: var(--wide); margin: 0 auto; min-height: calc(100svh - 160px); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 48px; padding: 48px 0; }
.cover-title { font: 600 clamp(48px, 9vw, 104px)/1 var(--f-text); letter-spacing: -0.02em; margin: 0; }
.cover-lead { font: italic 400 clamp(20px, 2.2vw, 26px)/1.4 var(--f-text); color: var(--muted); margin: 22px 0 32px; max-width: 30ch; text-wrap: pretty; }
.cover-start { font-size: 16px; padding: 11px 18px; }
.cover-code { margin: 0; display: grid; justify-items: center; gap: 12px; }
.cover-qr { display: block; width: 240px; border: 1px solid var(--rule); background: #fff; }
.cover-qr svg { display: block; width: 100%; height: auto; }
.cover-code figcaption { display: grid; justify-items: center; gap: 2px; font-size: 15px; color: var(--muted); }
.cover-code figcaption a { color: var(--ink); text-decoration: none; }
@media (max-width: 700px) {
  .cover { grid-template-columns: 1fr; gap: 36px; padding: 32px 0; min-height: 0; }
  .cover-code { justify-items: start; }
  .cover-code figcaption { justify-items: start; }
  .cover-qr { width: 180px; }
}
@media (max-width: 520px) { .brand-tail { display: none; } }

/* Radar legend on the map */
.radar-legend { position: absolute; top: 10px; right: 10px; z-index: 3; display: grid; gap: 4px; padding: 7px 9px 6px; background: rgba(255, 255, 255, 0.92); border: 1px solid #d6e0e6; border-radius: 3px; font-size: 12px; color: #1b2a3a; width: 190px; }
.radar-legend[hidden] { display: none; }
.radar-legend b { font-weight: 600; font-size: 13px; }
.rl-bar { display: flex; height: 9px; }
.rl-bar i { flex: 1; }
.rl-lab { display: flex; justify-content: space-between; color: #5b6a78; }

/* Summary of key points */
.summary .ch-head { max-width: var(--wide); }
.sum-grid { max-width: var(--wide); margin: 24px auto 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 26px 32px; }
.sum-card h3 { display: flex; gap: 10px; align-items: baseline; font: 600 19px/1.25 var(--f-text); margin: 0 0 8px; padding-top: 10px; border-top: 1px solid var(--rule); }
.sum-card h3 a { color: var(--ink); text-decoration: none; }
.sum-card h3 a:hover { color: var(--accent); }
.sum-n { color: var(--accent); font: 600 15px var(--f-ui); min-width: 1.4em; }
.sum-card ul { margin: 0; padding-left: 1.15em; display: grid; gap: 4px; font-size: 15.5px; line-height: 1.4; }
.sum-card li::marker { color: var(--muted); }
.map-tag { position: absolute; top: 14px; left: 66px; z-index: 3; padding: 5px 9px; background: rgba(255, 255, 255, 0.92); border: 1px solid #d6e0e6; border-radius: 3px; font-size: 13px; font-weight: 600; color: #1b2a3a; }
.map-tag[hidden] { display: none; }

/* Risk marking in the final passage */
.risk-list { display: grid; gap: 8px; margin: 12px 0 18px; }
.risk-opt { display: grid; gap: 2px; text-align: left; }
.risk-opt small { color: var(--muted); font-size: 13px; }
.risk-opt[aria-pressed="true"] small { color: inherit; opacity: 0.85; }
.risk-opt.risk-active { outline: 2px solid var(--accent); outline-offset: 2px; }
.lbl.lbl-risk { background: #fff; color: #a3246f; border: 1.5px solid #a3246f; text-shadow: none; padding: 2px 7px; border-radius: 2px; font: 700 13px/1.2 var(--f-ui); }
.lbl.lbl-risk-on { background: #a3246f; color: #fff; }

/* Flat forecast map */
.flat-map { position: relative; width: 100%; background: #dfe7ee; }
.flat-map[hidden] { display: none; }
.flat-map canvas { display: block; width: 100%; cursor: crosshair; touch-action: pan-y; }
.flat-map .map-tag { left: 10px; top: 10px; }
.map-wrap[hidden] { display: none; }
.opt-outs { margin: 6px 0 0; padding-left: 1.1em; color: var(--muted); font-size: 14px; display: grid; gap: 2px; }
.opt-outs li.mine { color: var(--ink); font-weight: 600; }

// Geometry of the fictional bay. Coordinates in km: x east 0..40, y north 0..30.

(function () {
  const W = 40, H = 30;

  // Sea outline, counter-clockwise from the south-west corner. Land is everything outside,

  const SEA = [
    [0, 0], [40, 0], [40, 6], [34, 6.5], [28, 7.5], [24, 8.5], [22.5, 10.5],
    [21.2, 12.2], [22.0, 13.6], [23, 14.6], [26.5, 14.8], [29.5, 16], [30.5, 18],
    [29.5, 20], [27, 21], [24, 21.2], [21.5, 20.2], [20.5, 18.5], [21.2, 16.5],
    [21.8, 15.0], [21.0, 13.9], [20.2, 12.6], [19.5, 11], [17, 11.5], [13, 11],
    [10.5, 9.5], [9, 7.5], [8.2, 5.0], [7.4, 5.6], [6.6, 8.0], [5.5, 11], [4.5, 14],
    [3.2, 17], [2.5, 21], [2.2, 25], [2.0, 30], [0, 30],

  const ISLAND = [
    [11.3, 3.0], [11.9, 2.1], [13.0, 1.9], [13.9, 2.6], [14.0, 3.6], [13.3, 4.5],
    [12.2, 4.6], [11.4, 4.0],
  ];

  const MARINA = { x: 25.5, y: 17.5, name: 'Марина Тихая' };
  const HARBOUR = { x: 2.9, y: 16.2, name: 'Порт Каменка' };
  const CAPE = { x: 8.2, y: 5.0, name: 'мыс Острый' };
  const ISLE = { x: 12.6, y: 3.2, r: 1.2, name: 'о. Камень' };
  // Strait centre line from the outer bay end to the inner bay end.
  const STRAIT = { a: [20.7, 12.4], b: [21.5, 13.75], name: 'пролив Узкий' };
  // Main ridge: an infinite line through these points; the plateau lies on its north-east side.
  const RIDGE = { a: [16, 28], b: [40, 17] };
  const PASSES = [
    { x: 22.0, y: 25.25, name: 'пер. Северный' },
    { x: 29.6, y: 21.75, name: 'пер. Восточный' },
  ];
  // Valleys from the crest (from) to the mouth on the inner bay shore (to).
  const VALLEYS = [
    { from: [22.0, 25.0], to: [22.2, 20.65], name: 'долина Северная' },
    { from: [35.0, 19.6], to: [30.45, 18.5], name: 'долина Восточная' },

  // High west coast north of the cape.
  const WEST_RIDGE = { a: [6.8, 9.5], b: [6.0, 26.5], h: 850 };

  function inPoly(x, y, P) {

  function landAnalytic(x, y) {

  // Signed distance from the ridge line, positive on the plateau side.

  }

  // Projection on segment: a in [0,1] along, c perpendicular distance to the infinite line,

  function segParam(x, y, ax, ay, bx, by) {

        if (i > 0) v = Math.min(v, out[k - NX - 1] + b);

  function elevAnalytic(x, y, d) {

  function isLand(x, y) {

  // Mean elevation over a square cell of the given size (km), used for the resolution topic.

    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {

    if (Math.hypot(x - MARINA.x, y - MARINA.y) < 1.5) return 'у марины';

    if (y > 14.3 && x > 20 && x < 31 && y < 21.5) return 'во Внутреннем заливе';
    if (Math.hypot(x - CAPE.x, y - CAPE.y) < 3) return 'у мыса Острый';
    if (Math.hypot(x - ISLE.x, y - ISLE.y) < 3) return 'у острова Камень';
    if (x < 7.5 && y > 6) return 'у западного берега';

})();

// Wind.at(x, y, state) -> { u, v, speed, dir, gust, variable, land, parts, mods, tau }
// u, v: where the air moves (east, north), knots. dir: meteorological "from", degrees.
//
// state fields (all optional):
//   G, Gdir      geostrophic (gradient) wind, knots and "from" degrees
//   hour         local hour; may exceed 24 for multi-day scenarios
//   sun          0..1, clear-sky factor for breeze, valley and katabatic winds
//   bora         0..1, intensity of the bora setup
//   front        { t0, speed, moveDir, ref:[x,y], preDir, postDir, preBase, prePeak,
//                  postBase, postPeak, strength }
//   storm        { x0, y0, t0, vx, vy, tStart, tPeak, tEnd, peak }

(function () {

  const breezeDay = (h) => { h = h24(h); return sstep(10.5, 13, h) * (1 - sstep(16.5, 19.5, h)); };
  const landBreezeNight = (h) => { h = h24(h); if (h >= 20) return sstep(20, 23, h); if (h < 9) return 1 - sstep(6, 9, h); return 0; };
  // Katabatic: starts after sunset, grows through the night, maximum before dawn, gone by mid-morning.
  const katNight = (h) => {

    if (t < 14.5) return 1 - sstep(10.5, 14.5, t);

  const scaleBora = (res) => (res ? 1 / (1 + res / 25) : 1); // bora intensity: 9 km -> 0.74
  const scaleJet = (res) => (res ? 1 / (1 + (res / 8) ** 2) : 1); // jets under passes

  function drawFronts(c, w, h, p, t) {

  // Station record under the section: pressure, wind barbs and precipitation against time.
  function record(c, w, h, p, secH, nb) {

    c.strokeStyle = 'rgba(28,42,68,0.12)'; c.lineWidth = 1;
    for (let tt = t0; tt <= t1; tt += 6) { c.beginPath(); c.moveTo(TX(tt), R.y); c.lineTo(TX(tt), R.y + R.h); c.stroke(); if (sys && nb && tt % 12) continue; const lb = sys ? (tt === 0 ? 'тёплый' : tt === 12 ? 'холодный' : `${tt > 0 ? '+' : ''}${tt} ч`) : tt === 0 ? 'фронт' : `${tt > 0 ? '+' : ''}${tt} ч`; txt(c, lb, TX(tt), R.y + R.h + 14, { size: 11.5, color: P.grey, align: 'center' }); }

    for (const [x, r] of rn) if (r > 0.05) { c.fillStyle = `rgba(52,102,176,${0.15 + 0.45 * r})`; c.fillRect(x - 2, R.y + R.h - 6 - r * 18, 4, r * 18); }
    c.strokeStyle = P.orange; c.lineWidth = 2.2; c.beginPath(); pr.forEach(([x, v], i) => (i ? c.lineTo(x, PY(v)) : c.moveTo(x, PY(v)))); c.stroke();
    for (const pv of [1004, 1008, 1012, 1016]) { const yy = PY(pv); if (yy < R.y + 6 || yy > R.y + R.h) continue; c.strokeStyle = 'rgba(224,82,10,0.18)'; c.beginPath(); c.moveTo(R.x, yy); c.lineTo(R.x + R.w, yy); c.stroke(); txt(c, String(pv), R.x - 4, yy + 4, { size: 11.5, color: P.orange, align: 'right' }); }
    txt(c, 'гПа', 4, R.y + 12, { size: 11.5, color: P.orange });

  }

  // ------------------------------------------------------------------ 3. breeze and the sum of winds
  function drawBreeze(c, w, h, p, t) {
    const nb = w < 600, A = { w, h: nb ? 250 : 270 };
    const hour = Wind.h24(p.hour), sunf = p.sun, sup = clamp(1 - p.G / 25, 0, 1);
    const day = Wind.breezeDay(hour) * sunf * sup, night = (hour >= 20 ? sstep(20, 23, hour) : hour < 9 ? 1 - sstep(6, 9, hour) : 0) * sunf * sup;
    const isDay = hour >= 6.5 && hour <= 19.5;
    sky(c, 0, 0, w, A.h, isDay ? 'day' : 'night');
    const yb = A.h * 0.7, xc = w * 0.5;
    sea(c, 0, yb, xc, A.h - yb, t);
    ground(c, [[xc, yb], [w * 0.62, yb - 6], [w * 0.78, yb - A.h * 0.08], [w, yb - A.h * 0.18]], A.h);
    const fr = clamp((hour - 6) / 13, 0, 1);
    if (isDay) sun(c, w * (0.08 + 0.84 * fr), 36 + 26 * Math.cos(fr * Math.PI) ** 2, 15); else moon(c, w - 46, 40, 14);
    if (sunf < 0.5) { cumulus(c, w * 0.3, 70, 22, { dark: true }); cumulus(c, w * 0.62, 64, 26, { dark: true }); cumulus(c, w * 0.85, 76, 20, { dark: true }); }
    const k = day > 0.2 ? day : night > 0.2 ? -night * 0.6 : 0;
    const title = k > 0 ? 'Дневной (морской) бриз' : k < 0 ? 'Ночной (береговой) бриз' : sunf < 0.5 ? 'Облачно: бриза нет' : 'Бриза нет';
    txt(c, title, 14, 26, { size: 17, weight: 700, color: isDay ? P.ink : '#fff' });
    const seaT = k > 0 ? 'море прохладное, давление выше (H)' : k < 0 ? 'море тёплое, давление ниже (L)' : 'море';
    const landT = k > 0 ? 'суша тёплая, давление ниже (L)' : k < 0 ? 'суша холодная, давление выше (H)' : 'суша';
    txt(c, seaT, xc / 2, yb + 30, { size: 13, color: '#fff', align: 'center', weight: 600, max: xc - 12 });
    txt(c, landT, w * 0.76, yb + 30, { size: 13, color: P.ink, align: 'center', weight: 600, max: w * 0.46 });
    const inkB = isDay ? 'rgba(70,80,95,0.8)' : 'rgba(210,220,235,0.85)';
    if (k !== 0) {
      const s = Math.abs(k), width = 2.5 + 5 * s, sp = 20 + 60 * s;
      const L0 = w * 0.12, R0 = w * 0.8, top = A.h * 0.26, low = yb - 22;
      const loop = k > 0
        ? { surf: [[L0, low], [R0 - 40, low]], up: [[R0, low - 10], [R0, top + 10]], aloft: [[R0 - 10, top], [L0 + 10, top]], down: [[L0, top + 10], [L0, low - 10]] }
        : { surf: [[R0, low - 10], [L0 + 40, low]], up: [[L0, low - 10], [L0, top + 10]], aloft: [[L0 + 10, top], [R0 - 10, top]], down: [[R0, top + 10], [R0, low - 10]] };
      flow(c, loop.up, inkB, 2, t, sp * 0.6); flow(c, loop.aloft, inkB, 2, t, sp * 0.6); flow(c, loop.down, inkB, 2, t, sp * 0.6);
      flow(c, loop.surf, P.orange, width, t, sp);
      tag(c, k > 0 ? `ветер с моря ${fmt(13 * day)} уз` : `ветер с суши ${fmt(5 * night)} уз`, (L0 + R0) / 2, low - 16, P.orange);
      if (k > 0.35) cumulus(c, w * 0.8, top - 6, 12 + 10 * k);
    }
    // ---- sum of winds, plan view, the lecture's three cases
    const B = { x: 0, y: A.h + 10, w, h: h - A.h - 10 };
    c.fillStyle = '#fff'; c.fillRect(B.x, B.y, B.w, B.h);
    txt(c, 'У берега днём: синоптический ветер + бриз', 12, B.y + 22, { size: 14, weight: 700 });
    const n = p.n, tx = -n[1], ty = n[0];
    const toF = (v) => [v[0] * n[0] + v[1] * n[1], v[0] * tx + v[1] * ty];
    const syn = toF(p.syn), br = toF(p.br), sum = [syn[0] + br[0], syn[1] + br[1]];
    const pw = nb ? w - 24 : Math.min(420, w * 0.55), ph = B.h - 44, px0 = 12, py0 = B.y + 32;
    // Sea and shore, shore on the right.
    const g = c.createLinearGradient(px0, 0, px0 + pw, 0); g.addColorStop(0, '#9fc5e6'); g.addColorStop(0.62, '#cfe3f3'); g.addColorStop(0.621, P.planLand); g.addColorStop(1, '#d8cba9');

  // ------------------------------------------------------------------ 4. katabatic and valley wind
  function drawKatabatic(c, w, h, p, t) {
    const hour = Wind.h24(p.hour), kn = Wind.katNight(hour) * p.sun * clamp(1 - p.G / 15, 0, 1), dv = Wind.breezeDay(hour) * p.sun;
    const night = hour < 6 || hour > 20, nb = w < 600, H0 = h, hh = h - 46;
    sky(c, 0, 0, w, hh, night ? 'night' : 'day');
    const yb = hh - 34;
    sea(c, 0, yb, w * 0.2, hh - yb, t);
    const S = [[w * 0.16, yb], [w * 0.3, yb - hh * 0.12], [w * 0.54, yb - hh * 0.4], [w * 0.74, yb - hh * 0.62], [w, yb - hh * 0.7]];
    ground(c, S, hh, '#b9a98c', '#8f7f64');
    if (night) moon(c, w - 46, 46, 16); else sun(c, w - 46, 46, 16);
    const along = (f, off) => {
      const seg = f * (S.length - 1), i = Math.min(S.length - 2, Math.floor(seg)), u = seg - i;
      const x = S[i][0] + (S[i + 1][0] - S[i][0]) * u, y = S[i][1] + (S[i + 1][1] - S[i][1]) * u;
      const dx = S[i + 1][0] - S[i][0], dy = S[i + 1][1] - S[i][1], L = Math.hypot(dx, dy);
      return [x + (dy / L) * off, y - (dx / L) * off];
    };
    const tc = night ? '#fff' : P.ink;
    if (kn > 0.05) {
      c.save(); const g = c.createLinearGradient(0, yb - hh * 0.7, 0, yb); g.addColorStop(0, 'rgba(120,170,235,0.25)'); g.addColorStop(1, 'rgba(120,170,235,0.5)'); c.fillStyle = g; c.beginPath();
      for (let f = 0; f <= 1; f += 0.02) { const [x, y] = along(f, 12 + 12 * f); f ? c.lineTo(x, y) : c.moveTo(x, y); }
      for (let f = 1; f >= 0; f -= 0.02) { const [x, y] = along(f, 0); c.lineTo(x, y); }
      c.closePath(); c.fill(); c.restore();
      const width = 2.5 + 4 * kn, sp = 25 + 70 * kn;
      for (const [f0, f1] of [[0.95, 0.72], [0.66, 0.42], [0.36, 0.12]]) flow(c, [along(f0, 16), along(f1, 16)], '#7fb2ff', width, t, sp);
      flow(c, [[w * 0.17, yb - 14], [w * 0.03, yb - 14]], '#7fb2ff', width + 1, t, sp);

      { const [x, y] = along(0.55, 30); txt(c, 'тепло уходит вверх', x - 16, y - 16, { size: 12, color: 'rgba(255,255,255,0.85)', align: 'right' }); }
      txt(c, nb ? 'ясная ночь: склон остывает, воздух тяжелеет' : 'ясная ночь: склон остывает излучением, воздух на нём тяжелеет', 12, 22, { size: 13.5, color: tc });
      txt(c, 'холодный воздух стекает по склону', nb ? 12 : 100, nb ? 48 : hh * 0.32, { size: nb ? 14 : 17, weight: 700, color: '#9cc4ff' });
      lines(c, ['в бухте ветер с берега 3–10 уз, максимум перед рассветом', `сейчас у устья Северной долины ${fmt(p.mouth)} уз`], 2, H0 - 26, 17, { size: 13, color: P.ink });
    } else if (dv > 0.1) {
      const width = 2.5 + 4 * dv, sp = 25 + 60 * dv;
      for (const [f0, f1] of [[0.08, 0.3], [0.38, 0.62], [0.7, 0.92]]) flow(c, [along(f0, 16), along(f1, 16)], P.orange, width, t, sp);
      if (dv > 0.5) cumulus(c, w * 0.8, yb - hh * 0.78, 18);
      txt(c, nb ? 'склоны греются, воздух поднимается' : 'склоны греются, воздух поднимается вдоль них', nb ? 12 : 100, 46, { size: nb ? 14 : 15, color: P.orange, weight: 700 });
      lines(c, ['днём ветер дует вверх по долине, у устья складывается с бризом', `сейчас у устья Северной долины ${fmt(p.mouth)} уз`], 2, H0 - 26, 17, { size: 13, color: P.ink });
    } else {
      txt(c, p.sun < 0.5 ? 'облачно: склон не остывает и не греется, стокового ветра нет' : p.G >= 12 ? 'сильный синоптический ветер размывает стоковый' : 'утро: стоковый ветер стих, долинный ещё не начался', 12, 50, { size: 15, color: tc });
    }
  }

  // Plan view of a valley from the bay (left) to its upper basin (right) with a gorge in the middle.
  // The same air passes every section, so in the gorge it moves about twice as fast.
  function drawValley(c, w, h, p, t, top) {
    const nb = w < 600, hour = Wind.h24(p.hour);
    const kn = Wind.katNight(hour) * p.sun * clamp(1 - p.G / 15, 0, 1), dv = Wind.breezeDay(hour) * p.sun;

    c.fillStyle = P.planLand; c.fillRect(bx, by, bw, bh);
    const sx = (s) => bx + s * bw;
    // Half-width of the valley floor along its axis (fractions of the box height).
    const K = [[0.14, 0.42], [0.24, 0.3], [0.38, 0.2], [0.5, 0.1], [0.6, 0.12], [0.72, 0.3], [0.86, 0.38], [1, 0.24]];
    const hw = (s) => { if (s <= K[0][0]) return 0.5; for (let i = 1; i < K.length; i++) if (s <= K[i][0]) { const [a, va] = K[i - 1], [b, vb] = K[i]; const q = sstep(a, b, s); return (va + (vb - va) * q) * bh; } return K[K.length - 1][1] * bh; };

    c.fillStyle = '#efe7cf'; c.beginPath();
    for (let s = 0.12; s <= 1.0001; s += 0.01) c.lineTo(sx(s), cy - hw(s));

    c.closePath(); c.fill();

    c.save(); c.beginPath(); c.rect(bx, by, bw, bh); c.clip();
    c.strokeStyle = 'rgba(120,95,55,0.25)'; c.lineWidth = 1;
    for (const sg of [-1, 1]) for (let k = 1; k <= 3; k++) { c.beginPath(); for (let s = 0.16; s <= 1.0001; s += 0.01) { const y = cy + sg * (hw(s) + k * 9); s === 0.16 ? c.moveTo(sx(s), y) : c.lineTo(sx(s), y); } c.stroke(); }

    txt(c, 'сужение', sx(0.5), cy - hw(0.5) - 12, { size: 12, color: P.ink, weight: 600, align: 'center', halo: P.planLand });
    if (!nb) txt(c, 'верховье долины', sx(0.86), by + 16, { size: 12, color: P.grey, align: 'center' });
    if (!mode) { txt(c, p.sun < 0.5 ? 'облачно: ни стокового, ни долинного ветра' : p.G >= 12 ? 'сильный синоптический ветер размыл стоковый' : 'ветер в долине сменяется: сейчас штиль', sx(0.56), cy + 5, { size: 13, weight: 600, align: 'center', halo: '#efe7cf' }); return; }

    for (const lane of [-0.55, 0, 0.55]) for (let k = 0; k < 16; k++) {
      let tau = ((k / 16 + t * 0.12) % 1) * Tt;

      const x = sx(s);

  function drawKatabaticPlan(c, w, h, p, t) {

  // ------------------------------------------------------------------ 5. bora
  function boraProfile(N) {
    const out = [];
    for (let i = 0; i < N; i++) {
      const km = (i / (N - 1)) * 30;
      out.push(km < 10 ? 0 : km < 16.5 ? 1500 * Math.pow((km - 10) / 6.5, 1.25) : km < 18 ? 1500 - ((km - 16.5) / 1.5) * 500 : 1000 - Math.min(1, (km - 18) / 3) * 100);
    }
    return out;
  }
  function drawBora(c, w, h, p, t) {
    const nb = w < 600;
    sky(c, 0, 0, w, h, 'day');
    const N = 301, prof = boraProfile(N), top = 62, base = h - 34, zs = (base - top) / 1900;
    const X = (i) => (i / (N - 1)) * w, Y = (z) => base - z * zs, I = (km) => Math.round((km / 30) * N);
    const win = I(9), model = prof.map((_, i) => { let s = 0, n = 0; for (let j = i - win / 2; j <= i + win / 2; j++) { s += prof[clamp(Math.round(j), 0, N - 1)]; n++; } return s / n; });
    sea(c, 0, base, X(I(10)), h - base, t, clamp(p.Bo, 0, 1));
    ground(c, prof.map((z, i) => [X(i), Y(z)]).slice(I(10) - 1), h, '#c6b79c', '#97866a');
    // Snow on the crest in winter.
    c.fillStyle = 'rgba(255,255,255,0.85)'; c.beginPath(); c.moveTo(X(I(15.2)), Y(prof[I(15.2)])); for (let i = I(15.2); i <= I(17.4); i++) c.lineTo(X(i), Y(prof[i])); c.lineTo(X(I(17.4)), Y(prof[I(17.4)]) + 8); c.lineTo(X(I(15.2)), Y(prof[I(15.2)]) + 8); c.closePath(); c.fill();
    if (p.cold) {
      const lvl = p.high ? 1560 : 1250;
      c.save(); const g = c.createLinearGradient(0, Y(lvl), 0, Y(900)); g.addColorStop(0, 'rgba(110,160,230,0.25)'); g.addColorStop(1, 'rgba(90,140,220,0.5)'); c.fillStyle = g; c.beginPath();
      let started = false;
      for (let i = N - 1; i >= 0; i--) { if (prof[i] > lvl || X(i) < w * 0.5) break; started ? c.lineTo(X(i), Y(prof[i])) : c.moveTo(X(i), Y(prof[i])); started = true; }
      c.lineTo(X(I(16.3)), Y(lvl)); c.lineTo(w, Y(lvl)); c.closePath(); c.fill(); c.restore();
      txt(c, 'холодный воздух −10 °C', w - 12, Y(1180), { size: 13.5, weight: 700, color: '#1d4f95', align: 'right', halo: '#cfe0f3' });
    }
    c.save(); c.strokeStyle = P.ink; c.setLineDash([6, 5]); c.lineWidth = 1.6; c.beginPath(); model.forEach((z, i) => (i ? c.lineTo(X(i), Y(z)) : c.moveTo(X(i), Y(z)))); c.stroke(); c.restore();
    const mMax = Math.max(...model), iM = model.indexOf(mMax);
    tag(c, 'модель 9 км: хребет около 900 м', X(iM) + 30, Y(mMax) + 30, 'rgba(28,42,68,0.8)', { align: 'left' });
    txt(c, '1500 м', X(I(16.5)) + 8, Y(1500) + 18, { size: 12, color: P.grey });
    if (p.high) { txt(c, 'H', w - 36, 36, { size: 28, weight: 800, color: '#2c5fb0', align: 'center' }); txt(c, nb ? 'антициклон' : 'антициклон за хребтом', w - 12, 54, { size: 12, color: P.grey, align: 'right' }); }
    if (p.low) { txt(c, 'L', 30, 36, { size: 28, weight: 800, color: P.red, align: 'center' }); txt(c, nb ? 'циклон' : 'циклон над морем', 12, 54, { size: 12, color: P.grey }); }
    if (p.high && p.low) { c.globalAlpha = 0.55; arrow(c, w - 62, 28, 58, 28, P.grey, 2); c.globalAlpha = 1; txt(c, 'давление падает к морю', w / 2, 22, { size: 12, color: P.grey, align: 'center' }); }
    const Bo = p.Bo;
    if (Bo > 0.05) {
      const k = clamp(Bo, 0, 1), wd = 2.5 + 3 * k, iC = I(16.5), crestY = Y(1500);
      flow(c, [[w - 20, Y(1000) - 46], [X(iC) + 60, crestY - 24]], P.blue, wd, t, 30 * k);
      flow(c, [[X(iC) + 10, crestY - 20], [X(iC) - 30, crestY + 26]], P.blue, wd + 0.5, t, 60 * k);
      flow(c, [[X(I(14.5)) + 10, Y(prof[I(14.5)]) - 18], [X(I(12)) + 4, Y(prof[I(12)]) - 14]], P.blue, wd + 1.5, t, 110 * k);
      flow(c, [[X(I(12)) - 6, base - 12], [X(I(7)), base - 10]], P.blue, wd + 2.5, t, 150 * k);
      flow(c, [[X(I(6)), base - 10], [16, base - 10]], P.blue, wd + 1, t, 100 * k);
      if (Bo >= 0.45) { cumulus(c, X(iC) + 4, crestY - 8, 15); txt(c, nb ? 'шапка на гребне' : 'облачная шапка на гребне', X(iC) - 30, crestY - 34, { size: 13, color: P.ink, halo: '#e3edf7', align: 'right' }); }

      txt(c, 'у берега: NE, ясно', 12, h - 12, { size: 13.5, color: '#fff', weight: 600 });
    } else {
      txt(c, !p.cold ? 'без холодного воздуха на плато перетекать через хребет нечему' : 'холодный воздух есть, но нет перепада давления к морю', 12, h * 0.5, { size: 15, color: P.grey });

  }

  // ------------------------------------------------------------------ 6. terrain
  function drawTerrain(c, w, h, p, t) {
    const narrow = w < 620, gap = 12, pw = narrow ? w : (w - gap * 2) / 3, ph = narrow ? 170 : h - 58;
    const panels = [
      { key: 'cape', title: 'Мыс', cap: 'ускорение на 20–40 %, волна круче' },
      { key: 'strait', title: 'Пролив', cap: 'воронка: сильнее, вдоль пролива' },
      { key: 'lee', title: 'Высокий берег', cap: 'тень на 5–10 высот, штиль и ротор' },
    ];
    panels.forEach((Q, i) => {
      const x0 = narrow ? 0 : i * (pw + gap), y0 = narrow ? i * (ph + 50) + 24 : 26, on = p.active === Q.key;
      c.save(); c.translate(x0, y0); roundRect(c, 0, 0, pw, ph, 8); c.clip();
      if (Q.key === 'lee') { sky(c, 0, 0, pw, ph, 'day'); sea(c, pw * 0.3, ph * 0.9, pw * 0.7, ph * 0.1, t); }
      else { const g = c.createLinearGradient(0, 0, 0, ph); g.addColorStop(0, '#a9cbe8'); g.addColorStop(1, '#7fb0d8'); c.fillStyle = g; c.fillRect(0, 0, pw, ph); }

      if (Q.key === 'cape') {

        // Streamlines bend round the cape: they crowd together and speed up at its tip, then spread out behind it.
        [[0.12, 0.11, 0.16, 1], [0.24, 0.2, 0.32, 1.1], [0.34, 0.29, 0.5, 1.3], [0.42, 0.38, 0.68, 1.5]].forEach(([y0s, ym, y1s, k]) =>
          flow(c, [[pw * 0.04, ph * y0s], [pw * 0.3, ph * (y0s + ym) / 2], [pw * 0.6, ph * ym], [pw * 0.8, ph * (ym + y1s) / 2], [pw * 0.95, ph * y1s]], ink, 2.6, t, sp * k));
        txt(c, '×1,3', x0 + pw * 0.74, ph * 0.9, { size: 24, weight: 800, color: P.orange });
      } else if (Q.key === 'strait') {

        poly(c, [[0, ph], [pw, ph], [pw, ph * 0.77], [pw * 0.62, ph * 0.62], [pw * 0.38, ph * 0.62], [0, ph * 0.77]], P.planLand);

        c.strokeStyle = P.blue; c.lineWidth = 2.6; c.beginPath(); c.arc(pw * 0.53, ph * 0.66, ph * 0.13, -0.2 + t * 2, Math.PI * 1.6 + t * 2); c.stroke();

  }

  // ------------------------------------------------------------------ 7. convection and thunderstorms
  const CONV = [
    [10, 13, 'Облако подтягивает воздух', 'Тёплый влажный воздух у воды стекается к растущему облаку и поднимается в нём. Под облаком ветер дует к нему, слабый.'],
    [13, 15, 'Облако растёт', 'Башня поднимается выше 5–6 км, вершина становится волокнистой. До грозы 30–60 минут: следите за облаком и радаром.'],
    [15, 17.5, 'Ливень и шквал', 'Из облака идут ливень и холодный нисходящий поток. Он растекается по воде, впереди идёт фронт порывов.'],
    [17.5, 21.01, 'Распад', 'Нисходящий поток гасит восходящий. Остаётся наковальня и слабый дождь, ветер стихает.'],

  // A single thunderstorm over the sea, stage by stage: inflow and updraft, growth, downpour with the squall
  // line running out ahead of the cell, decay. The yacht on the left meets the squall line.
  function drawConvection(c, w, h, p, t) {
    const hour = clamp(p.hour, 10, 21), nb = w < 600, idx = Math.max(0, CONV.findIndex((s) => hour >= s[0] && hour < s[1])), st = CONV[idx];
    const u = clamp((hour - st[0]) / (st[1] - st[0]), 0, 1);
    const sh = h - (nb ? 150 : 110), yb = sh - 30, cx = w * 0.6, xy = w * 0.16;
    sky(c, 0, 0, w, sh, idx === 2 ? 'storm' : idx === 3 ? 'dusk' : 'day');
    const xg = idx === 2 ? cx - 40 - (cx - 40 - w * 0.03) * u : null; // squall line position
    sea(c, 0, yb, w, sh - yb, t, idx === 2 ? 0.9 : 0.3);
    if (idx < 2) sun(c, w * 0.1, 36, 13);
    const warm = 'rgba(214,92,40,0.85)', cold = '#3f7fd6', cb = yb - sh * 0.34, inflow = idx === 0 ? 0.4 + 0.6 * u : idx === 1 ? 1 : 0;
    // Inflow at the surface toward the cloud and the updraft inside it.
    if (inflow > 0) {
      const wd = 2 + 2.5 * inflow, sp = 20 + 40 * inflow;
      flow(c, [[cx - w * 0.36, yb - 12], [cx - 30, yb - 14], [cx - 14, cb + 10]], warm, wd, t, sp);
      flow(c, [[cx + w * 0.34, yb - 12], [cx + 30, yb - 14], [cx + 14, cb + 10]], warm, wd, t, sp);
      flow(c, [[cx, cb - 6], [cx, cb - sh * (idx === 0 ? 0.12 + 0.1 * u : 0.4)]], warm, wd + 1, t, sp * 1.4);
    }
    if (idx === 0) {
      const s = (nb ? 16 : 22) + (nb ? 8 : 12) * u;
      cumulus(c, cx, cb, s);
      if (u > 0.5) cumulus(c, cx + 4, cb - s * 0.9, s * 0.8);
    } else if (idx === 1) {
      const n = 3 + Math.round(2 * u), s = nb ? 26 : 34;
      for (let k = 0; k < n; k++) cumulus(c, cx + (k % 2 ? 4 : -3), cb - k * s * 0.85, s - k * 2, { dark: k === 0 });
    } else {
      cumulonimbus(c, cx, cb, 34, nb ? 30 : 40, -1, { dark: idx === 2 });
    }
    if (idx === 2) {
      // Downpour and the cold downdraft that spreads over the water as a cold pool.
      rain(c, cx - 34, cx + 36, cb, yb, t, 2.6, 'rgba(60,90,150,0.65)');
      lightning(c, cx + 10, cb, yb, t);
      flow(c, [[cx - 4, cb - sh * 0.2], [cx - 4, yb - 10]], cold, 4.5, t, 90);
      const poolH = sh * 0.11;
      c.save(); const g = c.createLinearGradient(0, yb - poolH, 0, yb); g.addColorStop(0, 'rgba(90,140,220,0.15)'); g.addColorStop(1, 'rgba(90,140,220,0.45)');
      c.fillStyle = g; c.beginPath(); c.moveTo(xg - 6, yb);
      c.quadraticCurveTo(xg - 2, yb - poolH, xg + 40, yb - poolH); c.lineTo(cx + 70, yb - poolH * 0.8); c.quadraticCurveTo(cx + 110, yb - poolH * 0.5, cx + 120, yb);
      c.closePath(); c.fill(); c.restore();
      flow(c, [[cx - 12, yb - 8], [xg + 8, yb - 8]], cold, 5, t, 140);
      flow(c, [[cx + 12, yb - 8], [cx + 90, yb - 8]], cold, 3, t, 70);
      // Squall line: shelf cloud above the nose of the cold pool and a roll of white water under it.
      // The shelf hangs from the cloud base and reaches forward to the squall line, so it grows as the line runs out.
      const s0 = Math.max(xg + 24, cx - (nb ? 30 : 40) * 1.7 + 8), sg = c.createLinearGradient(0, cb - 6, 0, cb + 34);
      sg.addColorStop(0, '#4c5565'); sg.addColorStop(1, 'rgba(70,78,92,0.35)');
      c.fillStyle = sg; c.beginPath(); c.moveTo(s0, cb - 6);
      c.quadraticCurveTo((s0 + xg) / 2, cb - 2, xg - 4, cb + 30);
      c.quadraticCurveTo((s0 + xg) / 2 + 10, cb + 24, s0, cb + 8); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.9)';
      for (let k = 0; k < 9; k++) { const x = xg - 4 + k * 6 + Math.sin(t * 6 + k) * 2; c.beginPath(); c.arc(x, yb - 2 - (k % 3) * 2, 3 + (k % 2), 0, Math.PI * 2); c.fill(); }
      c.save(); c.setLineDash([6, 5]); c.strokeStyle = P.red; c.lineWidth = 2.5; c.beginPath(); c.moveTo(xg - 4, cb + 30); c.lineTo(xg - 4, yb + 4); c.stroke(); c.restore();
      tag(c, 'фронт порывов', xg - 6, cb + 52, P.red, { align: xg < w * 0.3 ? 'left' : 'right' });
    }
    if (idx === 3) rain(c, cx - 20, cx + 24, cb + 10, yb, t, 0.6, 'rgba(70,110,170,0.4)');
    // The yacht and its wind: toward the cloud before the squall line, from the cloud after it.
    boat(c, xy, yb + 1, nb ? 0.85 : 1);
    const hit = idx === 2 && xg <= xy + 6, kn = idx === 0 ? 4 + 3 * u : idx === 1 ? 8 : idx === 2 ? (hit ? 40 : 10) : 5;
    const dir = hit || idx === 3 ? 90 : 270;
    // Above the level of the shelf cloud, so the squall-line label never covers it.
    const yw = yb - sh * 0.5;
    barb(c, xy, yw, dir, kn, nb ? 24 : 30, P.ink);
    txt(c, `${hit ? 'за фронтом порывов ' : ''}ветер ${hit || idx === 3 ? 'от тучи' : 'к туче'}, ${fmt(kn)} уз`, xy, yw + (nb ? 22 : 26), { size: 12.5, weight: 700, align: 'center', halo: 'rgba(255,255,255,0.8)' });
    // Stage strip and description.
    const S0 = sh + 10, sw = (w - 16) / CONV.length;
    CONV.forEach((s, i) => {
      const x = 8 + i * sw, on = i === idx;
      c.fillStyle = on ? P.orange : 'rgba(28,42,68,0.08)'; roundRect(c, x + 1, S0, sw - 2, 8, 4); c.fill();
      if (!nb || on) txt(c, s[2], x + 2, S0 + 22, { size: 12, color: on ? P.ink : P.grey, weight: on ? 700 : 500, max: nb ? w - 16 : sw - 6 });
    });

  // point (base = 125 m × (T − Td)), L over land, H over sea, surface wind H -> L. Night: land colder, cold air
  // drains down the slope, H over land, L over sea.
  const HEAT = { day: { sea: 20, land: 28 }, night: { sea: 18, land: 12 }, top: 3000 };
  function heatOut(p) {
    const T = HEAT[p.night ? 'night' : 'day'], base = 125 * Math.max(0, T.land - p.td);

  }
  function drawHeat(c, w, h, p, t) {
    const nb = w < 600, o = heatOut(p), night = !!p.night;
    const yb = h - (nb ? 64 : 58), yTop = 58, xc = w * 0.42;
    const yAt = (m) => yb - (Math.min(m, HEAT.top) / HEAT.top) * (yb - yTop);
    sky(c, 0, 0, w, yb, night ? 'night' : 'day');
    sea(c, 0, yb, xc, h - yb, t);
    const S = [[xc, yb], [w * 0.55, yb - 4], [w * 0.75, yb - 16], [w * 0.9, yb - 44], [w, yb - 62]];
    ground(c, S, h);
    const gy = (x) => { for (let i = 0; i < S.length - 1; i++) if (x <= S[i + 1][0]) { const u = (x - S[i][0]) / (S[i + 1][0] - S[i][0]); return S[i][1] + (S[i + 1][1] - S[i][1]) * u; } return S[S.length - 1][1]; };
    if (night) moon(c, w - 40, 36, 14); else sun(c, w * (nb ? 0.86 : 0.62), 34, 16);
    const ink = night ? '#e8eef6' : P.ink, soft = night ? 'rgba(220,230,245,0.8)' : 'rgba(70,80,95,0.8)';
    // Height scale on the left.
    c.save(); c.strokeStyle = night ? 'rgba(255,255,255,0.18)' : 'rgba(28,42,68,0.12)'; c.lineWidth = 1; c.setLineDash([3, 5]);
    for (const m of [1000, 2000, 3000]) { c.beginPath(); c.moveTo(44, yAt(m)); c.lineTo(w, yAt(m)); c.stroke(); txt(c, `${m / 1000} км`, 6, yAt(m) + 4, { size: 12, color: soft }); }
    c.restore();
    // Surface temperatures.
    txt(c, `море ${o.T.sea} °C`, xc / 2, h - 18, { size: 14, weight: 700, color: '#fff', align: 'center' });
    txt(c, `суша ${o.T.land} °C`, w * 0.72, h - 18, { size: 14, weight: 700, color: P.ink, align: 'center' });
    // Pressure centres at the surface.
    const big = (s, x, y, col) => { c.font = `700 ${nb ? 30 : 36}px "Source Serif 4", Georgia, serif`; c.textAlign = 'center'; c.lineWidth = 5; c.strokeStyle = 'rgba(255,255,255,0.85)'; c.strokeText(s, x, y); c.fillStyle = col; c.fillText(s, x, y); c.textAlign = 'left'; };
    const xs = w * 0.17, xl = w * 0.68;
    if (!night) {
      // Thermal: a warm column rising from the land, temperatures every 1000 m up to the cloud base.
      const yg = gy(xl), top = o.cloud ? yAt(o.base) : yAt(2400);
      const g = c.createLinearGradient(0, yg, 0, top); g.addColorStop(0, 'rgba(238,120,60,0.34)'); g.addColorStop(1, 'rgba(238,120,60,0.06)');
      c.fillStyle = g; c.beginPath(); c.moveTo(xl - 26, yg); c.quadraticCurveTo(xl - 34, (yg + top) / 2, xl - 40, top); c.lineTo(xl + 40, top); c.quadraticCurveTo(xl + 34, (yg + top) / 2, xl + 26, yg); c.closePath(); c.fill();
      for (const dx of [-14, 14]) flow(c, [[xl + dx, yg - 8], [xl + dx, top + 14]], P.orange, 3, t, 40);
      for (let m = 0; m <= 2000; m += 1000) {
        if (o.cloud && m > o.base - 150) break;
        txt(c, `${o.T.land - m / 100} °C`, xl + 46, (m === 0 ? yg - 12 : yAt(m)) + 4, { size: 13, weight: 600, color: P.ink, halo: 'rgba(255,255,255,0.8)' });
      }
      if (o.cloud) {
        const cs = nb ? 22 : clamp(w * 0.026, 26, 36);
        cumulus(c, xl, top, cs);
        if (!nb) txt(c, `облако: воздух остыл до точки росы ${p.td} °C`, xl - 150, top - cs * 3.1, { size: 13, weight: 600, color: P.ink, max: 300 });
        c.save(); c.strokeStyle = 'rgba(28,42,68,0.55)'; c.setLineDash([2, 3]); c.beginPath(); c.moveTo(xl - 70, top); c.lineTo(xl + 70, top); c.stroke(); c.restore();
        txt(c, `${Math.round(o.base / 10) * 10} м`, nb ? xl + 34 : xl - 74, nb ? top - 8 : top + 4, { size: 13, weight: 700, align: nb ? 'left' : 'right', color: P.ink, halo: 'rgba(255,255,255,0.8)' });
      } else if (!nb) txt(c, 'воздух сухой: до точки росы не остыл, облака нет', xl - 160, yAt(2600), { size: 13, weight: 600, color: P.ink, max: 340 });
      const ty = nb ? yTop - 34 : yAt(900);
      txt(c, 'тёплый воздух легче и поднимается', nb ? 8 : xl - 260, ty, { size: 13, color: P.orange, weight: 700, halo: 'rgba(255,255,255,0.8)', max: nb ? w * 0.72 : 230 });
      txt(c, '−1 °C на каждые 100 м', nb ? 8 : xl - 260, ty + 18, { size: 13, color: P.ink, halo: 'rgba(255,255,255,0.8)', max: nb ? w * 0.72 : 230 });
      // Sinking over the sea and the return flow aloft.
      const ya = yAt(1700);
      flow(c, [[xl - 50, ya], [xs + 20, ya]], soft, 2, t, 25);
      flow(c, [[xs, ya + 14], [xs, yb - 54]], soft, 2, t, 25);
      txt(c, 'воздух опускается', nb ? xs + 8 : xs - 6, ya + 34, { size: 12.5, color: soft, align: nb ? 'left' : 'right', max: nb ? w * 0.4 : xs - 4 });
      big('H', xs, yb - 20, '#2f62a8'); big('L', xl - (nb ? 50 : 66), gy(xl - 60) - 20, '#c62f3a');
      flow(c, [[xs + 30, yb - 28], [xl - (nb ? 72 : 96), gy(xl - 90) - 28]], P.orange, 5, t, 60);
      tag(c, `ветер с моря ≈ ${o.wind} уз`, (xs + xl) / 2 - 20, yb - 44, P.orange);
    } else {
      // Night: cold air layer on the slope drains to the sea.
      c.save(); c.fillStyle = 'rgba(120,170,235,0.42)'; c.beginPath();
      for (let x = xc; x <= w; x += 6) { const y = gy(x) - 16 - 10 * ((x - xc) / (w - xc)); x === xc ? c.moveTo(x, y) : c.lineTo(x, y); }
      for (let x = w; x >= xc; x -= 6) c.lineTo(x, gy(x)); c.closePath(); c.fill(); c.restore();
      flow(c, [[w - 10, gy(w - 10) - 12], [w * 0.8, gy(w * 0.8) - 10], [xc + 20, yb - 10], [xs + 40, yb - 12]], '#9cc4ff', 4.5, t, 45);
      txt(c, 'суша остыла: холодный воздух тяжелее', nb ? 8 : w * 0.46, yAt(1500), { size: 13.5, weight: 700, color: '#cfe0ff', max: nb ? w - 16 : w * 0.5 });
      txt(c, 'и стекает по склону к морю', nb ? 8 : w * 0.46, yAt(1500) + 19, { size: 13.5, color: '#cfe0ff', max: nb ? w - 16 : w * 0.5 });
      flow(c, [[xs, yb - 50], [xs, yAt(1000)]], soft, 2, t, 20);
      big('L', xs, yb - 20, '#ff8a92'); big('H', xl, gy(xl) - 34, '#9cc4ff');
      tag(c, `ветер с берега ≈ ${o.wind} уз`, (xs + xl) / 2, yb - 30, '#3466b0');
    }
    p._out = o;
  }

  // ------------------------------------------------------------------ 2b. vertical section from L to H
  // Surfaces of equal pressure (1000, 900, 800, 700 hPa) sit lower over the cyclone and higher over the
  // anticyclone (height = 8 km × ln(Ps / p), deviation drawn 2.5× larger). Where the sea-level pressure
  // crosses a multiple of 4 hPa, the chart has an isobar: dense ticks mean strong wind.
  function drawIsobars(c, w, h, p, t) {
    const nb = w < 600, x0 = 40, x1 = w - (nb ? 56 : 80), yb = h - (nb ? 70 : 62), yTop = 34, zMax = 3600;
    const Y = (z) => yb - (z / zMax) * (yb - yTop);
    const f = (x) => clamp((x - x0) / (x1 - x0), 0, 1);
    const Ps = (x) => p.low + (p.high - p.low) * (0.5 - 0.5 * Math.cos(Math.PI * f(x)));
    // Height of a pressure surface; the tilt is exaggerated 2.5 times about the point where sea-level pressure is
    // 1000 hPa, so the 1000 hPa surface meets the sea exactly at the 1000 tick.
    const zOf = (pp, x) => 8000 * Math.log(1000 / pp) + 2.5 * 8000 * Math.log(Ps(x) / 1000);
    sky(c, 0, 0, w, yb, 'day');
    sea(c, 0, yb, w, h - yb, t, 0.3);
    // Columns of air: lighter over L, heavier over H.
    const col = (x, txtS, color) => { c.fillStyle = color; c.fillRect(x - 16, yTop, 32, yb - yTop); txt(c, txtS, x, yTop - 10, { size: 12, color: P.grey, align: 'center', max: 140 }); };
    col(x0 + 20, nb ? 'столб легче' : 'столб воздуха легче', 'rgba(198,47,58,0.08)');
    col(x1 - 20, nb ? 'столб тяжелее' : 'столб воздуха тяжелее', 'rgba(52,102,176,0.10)');

    for (const pp of [1000, 900, 800, 700]) {
      c.strokeStyle = 'rgba(28,42,68,0.7)'; c.lineWidth = 1.6; c.beginPath();
      let started = false;
      for (let x = x0 - 20; x <= x1 + 20; x += 4) { const z = zOf(pp, x); if (z < 0) { started = false; continue; } const y = Y(z); if (!started) { c.moveTo(x, y); started = true; } else c.lineTo(x, y); }

    flow(c, [[x0 + 40, Y(300)], [x0 + 40, Y(1700)]], '#d0553a', 2.5, t, 30);
    flow(c, [[x1 - 40, Y(2600)], [x1 - 40, Y(500)]], P.blue, 2.5, t, 30);
    const big = (s, x, col2) => { c.font = `700 ${nb ? 28 : 34}px "Source Serif 4", Georgia, serif`; c.textAlign = 'center'; c.lineWidth = 5; c.strokeStyle = 'rgba(255,255,255,0.85)'; c.strokeText(s, x, Y(2900)); c.fillStyle = col2; c.fillText(s, x, Y(2900)); c.textAlign = 'left'; };
    big('L', x0 + 40, '#c62f3a'); big('H', x1 - 40, '#2f62a8');
    txt(c, nb ? 'поднимается' : 'воздух поднимается', x0 + 54, Y(1100), { size: 12.5, color: '#b0482a', weight: 600, halo: 'rgba(255,255,255,0.8)' });
    txt(c, 'опускается', x1 - 54, Y(1100) - (nb ? 40 : 0), { size: 12.5, color: P.blue, weight: 600, align: 'right', halo: 'rgba(255,255,255,0.8)' });

    txt(c, nb ? 'изобары на карте: гуще в середине, там ветер сильнее' : 'Изобары на карте у поверхности моря, через 4 гПа: где они гуще, там ветер сильнее', 8, h - 10, { size: 12.5, color: P.ink, weight: 600, max: w - 16 });

  }


  // ------------------------------------------------------------------ global and regional models
  // Grid and forecast range from the lecture table «Основные модели» (models used for the Adriatic).
  const MODELS = [
    ['GFS', 13, 16, 'g'], ['AIFS (нейросеть)', 28, 15, 'g'], ['ECMWF IFS', 9, 10, 'g'], ['ICON', 13, 7.5, 'g'], ['UKMO', 10, 7, 'g'],
    ['ICON-EU', 7, 5, 'r'], ['Swiss HD', 2, 3, 'r'], ['ICON-D2', 2, 2, 'r'], ['AROME', 1.3, 2, 'r'],

  // Which models to read at a given lead time, days.
  function modelsFor(lead) {
    if (lead <= 2) return ['AROME', 'ICON-D2', 'Swiss HD'];

  }
  function drawModels(c, w, h, p) {
    const nb = w < 620, lead = p.lead, use = modelsFor(lead);

    for (const d of [0, 1, 2, 3, 5, 7, 10, 16]) {

      const y = top + i * rowH, on = use.includes(name), reach = days >= lead, col = kind === 'g' ? P.blue : P.orange;
      if (i === 5) { c.strokeStyle = 'rgba(28,42,68,0.35)'; c.setLineDash([4, 3]); c.beginPath(); c.moveTo(6, y - 2); c.lineTo(x1, y - 2); c.stroke(); c.setLineDash([]); }
      c.globalAlpha = reach ? (on ? 1 : 0.45) : 0.15;
      c.fillStyle = col; c.fillRect(X(0), y + 4, X(days) - X(0), rowH - 9);
      c.globalAlpha = 1;
      txt(c, name, x0 - 8, y + rowH / 2 + 4, { size: nb ? 11.5 : 12.5, weight: on ? 700 : 500, color: reach ? P.ink : P.soft, align: 'right' });
      const lab = `${String(km).replace('.', ',')} км`, bx = X(days);
      txt(c, lab, bx + 4 < x1 - 40 ? bx + 4 : bx - 4, y + rowH / 2 + 4, { size: 11.5, weight: 600, color: bx + 4 < x1 - 40 ? P.grey : '#fff', align: bx + 4 < x1 - 40 ? 'left' : 'right' });
    });
    c.font = FONT(11.5, 700);
    txt(c, 'региональные', x1, 20, { size: 11.5, color: P.orange, weight: 700, align: 'right' });
    txt(c, 'глобальные', x1 - c.measureText('региональные').width - 14, 20, { size: 11.5, color: P.blue, weight: 700, align: 'right' });
    // Lead-time cursor.
    const xc = X(lead);
    c.strokeStyle = P.red; c.lineWidth = 2; c.beginPath(); c.moveTo(xc, top - 6); c.lineTo(xc, yAxis - 6); c.stroke();
    tag(c, lead < 1 ? `через ${Math.round(lead * 24)} ч` : lead === 1 ? 'через сутки' : `через ${String(lead).replace('.', ',')} суток`, xc, top - 8, P.red, { align: xc > x1 - 60 ? 'right' : 'center' });
    // The bay under the grid of the chosen model.
    const g = p.grid, bx0 = nb ? 10 : cw + 16, by0 = nb ? yAxis + 50 : 40;
    const bh = Math.min((nb ? w - 20 : w - cw - 26) * 0.75, h - by0 - 50), bw = bh / 0.75;
    const BX = (x) => bx0 + (x / 40) * bw, BY = (y) => by0 + bh - (y / 30) * bh;
    txt(c, `Бухта на сетке ${String(g).replace('.', ',')} км`, bx0, by0 - 10, { size: 14, weight: 700 });
    c.fillStyle = P.planLand; c.fillRect(bx0, by0, bw, bh);
    c.fillStyle = P.seaPlan; c.beginPath(); Bay.SEA.forEach(([x, y], i) => (i ? c.lineTo(BX(x), BY(y)) : c.moveTo(BX(x), BY(y)))); c.closePath(); c.fill();
    c.fillStyle = P.planLand; c.beginPath(); Bay.ISLAND.forEach(([x, y], i) => (i ? c.lineTo(BX(x), BY(y)) : c.moveTo(BX(x), BY(y)))); c.closePath(); c.fill();
    c.strokeStyle = g >= 5 ? 'rgba(28,42,68,0.55)' : 'rgba(28,42,68,0.22)'; c.lineWidth = g >= 5 ? 1.5 : 0.8;
    for (let x = 0; x <= 40.01; x += g) { c.beginPath(); c.moveTo(BX(x), by0); c.lineTo(BX(x), by0 + bh); c.stroke(); }
    for (let y = 0; y <= 30.01; y += g) { c.beginPath(); c.moveTo(bx0, BY(y)); c.lineTo(bx0 + bw, BY(y)); c.stroke(); }
    c.strokeStyle = P.ink; c.lineWidth = 1; c.strokeRect(bx0, by0, bw, bh);
    const n = Math.round((40 / g) * (30 / g));
    lines(c, [`${n} ${n % 10 === 1 && n % 100 !== 11 ? 'ячейка' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'ячейки' : 'ячеек'} на карту 40 × 30 км.`,
      g >= 5 ? 'Пролив и мыс меньше ячейки: модель их не видит.' : 'Видны пролив, мыс и долины.'], bx0, by0 + bh + 20, 17, { size: 12.5, color: P.ink });
    p._out = { use };
  }

  // ------------------------------------------------------------------ class
  const DRAW = { isobars: drawIsobars, heat: drawHeat, beaufort: drawBeaufort, fog: drawFog, synoptic: drawSynoptic, fronts: drawFronts, breeze: drawBreeze, katabatic: drawKatabaticPlan, bora: drawBora, terrain: drawTerrain, convection: drawConvection, resolution: drawResolution, models: drawModels };
  const HEIGHT = { isobars: [360, 400], heat: [460, 520], beaufort: [360, 520], fog: [340, 520], synoptic: [520, 460], fronts: [600, 640], breeze: [520, 640], katabatic: [600, 610], bora: [340, 340], terrain: [260, 700], convection: [460, 540], resolution: [330, 340], models: [360, 700] };
  const TITLES = {
    heat: 'Море и суша в разрезе: нагрев, подъём воздуха, давление',
    isobars: 'Разрез от циклона к антициклону: поверхности одинакового давления',
    beaufort: 'Шкала Бофорта: море, паруса и флажок ветра', fog: 'Туман: температура, точка росы и где он ложится',
    synoptic: 'Синоптическая карта: изобары, центры давления, фронты, ветер', fronts: 'Фронт в разрезе с запада на восток и запись на яхте', breeze: 'Бриз в разрезе и сумма ветров у берега',
    katabatic: 'Склон в разрезе и долина сверху', bora: 'Бора в разрезе: плато — хребет — море', terrain: 'Рельеф: мыс, пролив, высокий берег',
    convection: 'Гроза над морем: от облака до шквала', resolution: 'Рельеф в разрезе: факт и модель',
  };

  class Section {
    constructor(container, opts = {}) {
      this.opts = opts;
      this.box = document.createElement('figure'); this.box.className = 'section' + (opts.big ? ' section-big' : '');
      this.cap = document.createElement('figcaption'); this.cap.className = 'section-title';
      this.canvas = document.createElement('canvas'); this.canvas.className = 'section-canvas';
      this.canvas.setAttribute('role', 'img');
      this.box.append(this.cap, this.canvas); container.appendChild(this.box);
      this.type = null; this.p = null; this.alive = true; this._vis = true;
      this._io = new IntersectionObserver((e) => { this._vis = e[0].isIntersecting; }); this._io.observe(this.box);

    }
    _pointer(cb) {
      const cv = this.canvas; cv.style.touchAction = 'pan-y'; cv.style.cursor = 'crosshair';
      let d = null;
      const pos = (e) => { const r = cv.getBoundingClientRect(); return [clamp((e.clientX - r.left) / r.width, 0.02, 0.98), clamp((e.clientY - r.top) / r.height, 0.02, 0.98)]; };
      cv.addEventListener('pointerdown', (e) => { d = { x: e.clientX, y: e.clientY, mouse: e.pointerType === 'mouse' }; if (d.mouse) cb(pos(e)); });
      cv.addEventListener('pointermove', (e) => { if (d && d.mouse && e.buttons) cb(pos(e)); });
      cv.addEventListener('pointerup', (e) => { if (d && !d.mouse && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 10) cb(pos(e)); d = null; });
    }
    set(type, p) {

      if (type) { this.cap.textContent = TITLES[type]; this.canvas.setAttribute('aria-label', TITLES[type]); }
      this._dirty = true;
      if (type) this._draw(performance.now()); // draw now so derived values (p._out) are ready
    }
    _draw(now) {
      const reduced = typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const fx = (o) => ({ ...OFF, ...o });
  const pct = (x) => `${x >= 0 ? '+' : '−'}${Math.round(Math.abs(x) * 100)} %`;
  const nm = (km) => fmtNum(km / 1.852, 1);

  function modelCells(stateFn, res) {
    const nx = Math.floor(Bay.W / res) + 1, ny = Math.floor(Bay.H / res) + 1, list = [];
    const k = Math.max(2, Math.min(10, Math.round(res / 0.6)));
    const S = stateFn(res);
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      let u = 0, v = 0, g = 0, land = 0;
      for (let b = 0; b < k; b++) for (let a = 0; a < k; a++) {
        const x = Math.min(Bay.W, i * res + ((a + 0.5) * res) / k), y = Math.min(Bay.H, j * res + ((b + 0.5) * res) / k);
        const w = Wind.at(x, y, S); u += w.u; v += w.v; g += w.gust; land += w.land ? 1 : 0;
      }
      u /= k * k; v /= k * k; g /= k * k;
      const speed = Math.hypot(u, v);
      list.push({ x0: i * res, y0: j * res, size: res, land: land / (k * k) > 0.5, u, v, speed, gust: Math.max(g, speed * 1.2), dir: speed > 0.05 ? Wind.dirOf(u, v) : null });
    }
    return { res, nx, ny, list };
  }
